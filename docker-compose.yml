# Production setup: Wichtel + PostgreSQL.
# Works with `docker compose` (values from .env next to this file) and as a
# Portainer stack (values from the stack's environment variables).
# Put a reverse proxy with TLS (Caddy, Traefik, nginx) in front of the app port.
services:
  app:
    image: ${WICHTEL_IMAGE:-ghcr.io/yniverz/wichtel:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wichtel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/wichtel
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, e.g. https://helfen.example.de}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Behind a reverse proxy: trust its headers for protocol, host and client IP.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
    ports:
      # Host address and port the app is reachable on (container listens on 3000).
      - '${WICHTEL_BIND:-127.0.0.1}:${WICHTEL_PORT:-3006}:3000'
    volumes:
      - uploads:/data

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wichtel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: wichtel
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wichtel']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  postgres:
